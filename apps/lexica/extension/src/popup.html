<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
body{margin:0;width:280px;background:#0E0F11;color:#EDEEF0;font:14px/1.45 system-ui,sans-serif;padding:14px}
h1{font-size:15px;margin:0 0 10px}h1 span{color:#C6F432}
.lbl{margin:12px 0 6px;color:#9AA0A8;font-size:12px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:7px 0;border-radius:8px;border:1px solid #26282D;background:none;color:#C4C6CB;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{border-color:#C6F432;color:#C6F432}
#toggle{width:100%;padding:9px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer;background:#C6F432;color:#0E0F11}
#toggle.off{background:#26282D;color:#EDEEF0}#toggle:disabled{opacity:.4;cursor:default}
.muted{color:#9AA0A8;font-size:12px}.warn{color:#F5B942;font-size:12px}
label{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;color:#C4C6CB}
ul{list-style:none;margin:4px 0 0;padding:0}li{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#C4C6CB;padding:2px 0}
li button{background:none;border:0;color:#9AA0A8;cursor:pointer}
</style></head><body>
<h1>Lexica <span>Blend</span></h1>
<div class="muted" id="host"></div>
<p class="warn" id="blocked" hidden>Trang nhạy cảm (ngân hàng, email, y tế, cơ quan nhà nước hoặc đăng nhập): Blend không chạy ở đây.</p>
<div style="margin-top:10px"><button id="toggle"></button></div>
<div class="lbl">Cường độ</div><div class="seg" id="intensity"></div>
<div class="muted" id="estimate" style="margin-top:6px"></div>
<div class="lbl">Cách hiện</div><div class="seg" id="mode"></div>
<label><input type="checkbox" id="en"> Đổi từ trên trang tiếng Anh (thử nghiệm)</label>
<div class="lbl">Trang đang bật</div><ul id="sites"></ul>
<p class="muted" id="sync"></p>
<p class="muted">Chạm vào từ được đổi để xem nghĩa. Không gửi nội dung trang đi đâu.</p>
<script src="prefs.js"></script><script src="popup.js"></script></body></html>
