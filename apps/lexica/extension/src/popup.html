<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
body{margin:0;width:290px;background:#101012;color:#F4F2EA;font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
h1{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 span{background:#C6F432;color:#16150F;border:1.5px solid #000;border-radius:999px;padding:0 8px;font-size:13px}
.lbl{margin:14px 0 6px;color:#9C9AA3;font:700 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:7px 0;border-radius:10px;border:1.5px solid #2C2C33;background:#1B1B1F;color:#D4D2CA;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:#F4F2EA;border-color:#F4F2EA;color:#101012}
#toggle{width:100%;padding:10px;border-radius:14px;border:2px solid #000;font:inherit;font-weight:800;cursor:pointer;background:#C6F432;color:#16150F;box-shadow:3px 3px 0 #000}
#toggle:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
#toggle.off{background:#1B1B1F;color:#F4F2EA;border-color:#2C2C33;box-shadow:none}#toggle:disabled{opacity:.4;cursor:default}
.muted{color:#9C9AA3;font-size:12px}.warn{color:#F2C230;font-size:12px}
label{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px;color:#D4D2CA}
ul{list-style:none;margin:4px 0 0;padding:0}li{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#D4D2CA;padding:3px 0}
li button{background:none;border:0;color:#9C9AA3;cursor:pointer}
</style></head><body>
<h1>Lexica <span>Blend</span></h1>
<div class="muted" id="host"></div>
<p class="warn" id="blocked" hidden>Trang nhạy cảm (ngân hàng, email, y tế, cơ quan nhà nước hoặc đăng nhập): Blend không chạy ở đây.</p>
<div style="margin-top:10px"><button id="toggle"></button></div>
<div class="lbl">Cường độ</div><div class="seg" id="intensity"></div>
<div class="muted" id="estimate" style="margin-top:6px"></div>
<div class="lbl">Cách hiện</div><div class="seg" id="mode"></div>
<label><input type="checkbox" id="en"> Đổi từ trên trang tiếng Anh (thử nghiệm)</label>
<div class="lbl">Trang đang bật</div><ul id="sites"></ul>
<p class="muted" id="sync"></p>
<p class="muted">Chạm vào từ được đổi để xem nghĩa. Không gửi nội dung trang đi đâu.</p>
<script src="prefs.js"></script><script src="popup.js"></script></body></html>
