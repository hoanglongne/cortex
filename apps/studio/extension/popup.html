<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
        body { width: 320px; }
        main { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        #url { font-size: 12px; color: var(--muted); word-break: break-all; max-height: 36px; overflow: hidden; }
    </style>
</head>
<body>
    <main>
        <h1>Gửi vào Lexica Studio</h1>
        <p id="url"></p>
        <label>Nội dung (bôi đen trên trang sẽ tự điền)
            <textarea id="text" rows="3" maxlength="2000" placeholder="Để trống: Studio tự đọc nội dung từ link (Threads, Facebook, TikTok)"></textarea>
        </label>
        <label>Ghi chú (tuỳ chọn)
            <textarea id="note" rows="2" maxlength="500" placeholder="Vì sao trend, ai hay nói…"></textarea>
        </label>
        <div class="row">
            <button id="send" class="primary">Gửi</button>
            <button id="settings" type="button">Cài đặt</button>
        </div>
        <p id="status" class="status"></p>
    </main>
    <script src="lib/extract.js"></script>
    <script src="popup.js"></script>
</body>
</html>
